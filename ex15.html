<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FRAMEWORKS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body >
    <!-- Atividade 15 - Combine o Ex 14 com um número. Se curtir, soma 1. Se descurtir, subtrai 1. -->
    
    <div class="flex grid gap-3 justify-center pt-15 m-5 pb-15 border border-black font-bold text-2xl text-blue-500" x-data="{liked : 0}">
        <button class="btn btn-primary" @click="liked++">Like 👍</button>
        <button class="btn btn-error" @click="liked--">Deslike 👎</button>
        <h1 class="text-md text-gray-600">
            Quantidade de likes: <span x-text="liked"></span>
        </h1>
    
</body>
</html>
