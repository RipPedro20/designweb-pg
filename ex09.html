<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FRAMEWORKS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body >
    <!-- Atividade 9 - Estado: { ligado: false }. Botão que alterna entre true/false (ligado = !ligado). O texto do botão deve mudar para "Ligar" ou "Desligar" usando ternário no x-text. -->
    
    <div class="flex justify-center pt-15 m-5 pb-15 border border-black font-bold text-2xl text-blue-500" x-data="{ligado: false}">

        <button class="btn btn-error" @click="ligado = !ligado" x-text="ligado ? 'Ligar' : 'Desligar' "></button>
    
    </div>
</body>
</html>
