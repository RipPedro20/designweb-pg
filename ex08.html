<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FRAMEWORKS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body >
    <!-- Atividade 8 - Melhore o Ex 07. Adicione um botão "-" (decremento) e um botão "Reset" (volta a zero). -->
    
    <div class="flex grid justify-center pt-15 m-5 pb-15 border border-black font-bold text-2xl text-blue-500" x-data="{count: 0}">
        <span class="flex justify-center block pb-5" x-text="count"></span>

        <div>
            <button class="btn btn-neutral" x-on:click="count++">+</button>
            <button class="btn btn-secundary" x-on:click="count = 0">Reset</button>
            <button class="btn btn-neutral" x-on:click="count--">-</button>
        </div>

        
    </div>
</body>
</html>
