<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FRAMEWORKS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body >
    <!-- Atividade 12 - Botão "Menu". Ao clicar, exibe uma lista de links abaixo dele. Ao clicar de novo, esconde. -->
    
    <div class="flex grid justify-center pt-15 m-5 pb-15 border border-black font-bold text-2xl text-blue-500" x-data="{menu : false}">
        <button class="btn btn-neutral" @click="menu = !menu">Menu ↓</button>
            <div class="flex grid text-sm text-gray-600 bg-slate-100 justify-center">
                <a x-show="menu" x-transition href="#">Header</a>
                <a x-show="menu" x-transition href="#">Main</a>
                <a x-show="menu" x-transition href="#">Footer</a>
            </div>
    </div>
    
</body>
</html>
