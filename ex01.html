<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O espelho digital - X-model</title>
    <!-- FRAMEWORKS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    
    <div class="grid max-w-100 mx-auto mt-5 border rounded p-5 text-lg" x-data="{nome : '' }">
        <input class="text-gray-400" type="text" placeholder="Digite seu nome" x-model="nome">

        <span>
            Olá 
            <span class="text-purple-500 font-bold" x-text="nome.toUpperCase() || 'Anônimo'">
                
            </span>
        </span>
    </div>
    
</body>
</html>
