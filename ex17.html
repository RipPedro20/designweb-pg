<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FRAMEWORKS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex grid justify-center" x-data="{modal : false}">
    <!-- Atividade 17 - Botão "Abrir Modal". Exibe um div centralizada com fundo escuro. Botão "Fechar" dentro do modal esconde ele. -->
    <button class="btn btn-primary" @click="modal = !modal">Abrir modal</button>
    <div x-show="modal" data-theme="dark" class="flex grid gap-3 justify-center w-200 pt-15 m-5 pb-15 border border-black font-bold text-2xl text-blue-500 rounded-sm" >
        <h1>Hello</h1>
        <button @click="modal = !modal" class="btn btn-warning">Fechar</button>
    </div>
</body>
</html>
