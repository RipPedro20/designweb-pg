<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FRAMEWORKS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body >
    <!-- Atividade 7 - Estado: { count: 0 }. Botão "+" aumenta o valor. Span mostra o valor atualizado. -->
    
    <div class="flex justify-center pt-15 m-5 pb-15 border border-black font-bold text-2xl text-red-500" x-data="{count: 0}">
        <button class="btn btn-primary" x-on:click="count++">+</button>
        <span class="pl-5" x-text="count"></span>
    </div>
</body>
</html>
