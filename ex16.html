<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FRAMEWORKS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body >
    <!-- Atividade 16 - 3 botões (Tab 1, 2, 3) e 3 divs de conteúdo. Use uma variável tab: 1 para controlar qual div aparece com x-show. -->
    
    <div class="flex grid gap-3 justify-center pt-15 m-5 pb-15 border border-black font-bold text-2xl text-blue-500" x-data="{tab : 1, tab1 : 2, tab2 : 3}">
        <button class="btn btn-primary" @click="tab = !tab">Tab 1</button>
        <div x-show="tab">Tab 1 - Opa!</div>
        <button class="btn btn-error" @click="tab1 = !tab1">Tab 2</button>
        <div x-show="tab1">Tab 2 - Eai!</div>
        <button class="btn btn-info" @click="tab2 = !tab2">Tab 3</button>
        <div x-show="tab2">Tab 3 - Eu to aqui em!</div>
    
</body>
</html>
