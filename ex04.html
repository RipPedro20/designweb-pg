<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FRAMEWORKS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body >
    <!-- Atividade 4 - Estado: { link: '<a href="#">Clique aqui</a>' }. Use a diretiva x-html para renderizar o link funcional, não o texto da tag. -->

    <div class="flex justify-center pt-15 border" x-data="{link: `<a href='#'>Clique aqui </a>`}">
        
        <h1 class="font-bold text-2xl text-red-500" x-html="link"></h1>
        
    </div>
</body>
</html>
