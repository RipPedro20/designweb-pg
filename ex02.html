<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FRAMEWORKS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body >
    <!-- Atividade 2 - Crie um estado com { preco: 10, qtd: 5 }. Em um parágrafo, exiba o total (multiplicação) usando JS diretamente dentro do x-text. -->

    <div class="flex justify-center pt-15 border" x-data="{preco: 10, qtd: 5}">
        <p class="font-bold text-2xl text-red-500" x-text="preco * qtd"></p>
        
    </div>
</body>
</html>
